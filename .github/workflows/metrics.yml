name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MuhammadSufyanKhn
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Karachi
          config_output: svg
          filename: github-metrics.svg

          # Languages breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # Isometric contribution calendar (the 3D-looking one)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Save output back to repo
          output_action: commit
          committer_branch: main
          committer_message: "chore: update github-metrics.svg"
